<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ターボドライブ</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0a1e; color: #fff;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; touch-action: none; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  .glass { background: rgba(8,10,30,.62); border: 1px solid rgba(120,220,255,.45); box-shadow: 0 0 18px rgba(0,200,255,.25); backdrop-filter: blur(4px); }

  #top { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #stat { flex: none; border-radius: 12px; padding: 6px 12px; font-style: italic; font-weight: bold; min-width: 130px; }
  #score { font-size: 26px; letter-spacing: .06em; color: #7df9ff; font-variant-numeric: tabular-nums; }
  #combo { font-size: 15px; color: #ff80ab; }
  #stars { font-size: 15px; color: #ffd54f; }
  #qbox { flex: 1; border-radius: 16px; padding: 6px 14px; text-align: center; min-height: 60px; }
  #qvis { font-size: clamp(24px, 4.6vw, 40px); font-weight: bold; line-height: 1.15; }
  #qvis .kanji { font-size: clamp(56px, 11vw, 96px); line-height: 1; text-shadow: 0 0 16px #7df9ff; }
  #qvis .eq { color: #fff59d; }
  #qvis svg { width: clamp(84px, 16vw, 130px); height: auto; }
  .hissan { font-family: "Menlo","Courier New",monospace; font-size: 26px; white-space: pre; text-align: left; display: inline-block; margin-left: 18px; vertical-align: middle; color: #b2ebf2; }
  #qtext { font-size: clamp(16px, 3vw, 24px); color: #b3e5fc; }
  #right { flex: none; display: flex; gap: 8px; }
  @media (max-aspect-ratio: 1/1) { #top { flex-wrap: wrap; } #qbox { order: 3; flex-basis: 100%; } #right { margin-left: auto; } }
  .round { width: 50px; height: 50px; border-radius: 50%; border: 2px solid rgba(120,220,255,.7); background: rgba(8,10,30,.7);
    color: #fff; font-size: 22px; cursor: pointer; font-family: inherit; }
  .round:active { background: rgba(0,180,255,.5); }
  #autoBtn { width: auto; border-radius: 25px; padding: 0 14px; font-size: 14px; font-weight: bold; }
  #autoBtn.on { background: rgba(0,200,120,.6); }

  #msg { position: fixed; top: 38%; left: 0; right: 0; text-align: center; font-size: clamp(44px, 11vw, 100px); font-weight: 900; font-style: italic;
    text-shadow: 0 0 24px currentColor, 0 5px 0 rgba(0,0,0,.4); pointer-events: none; opacity: 0; }
  #msg.show { animation: pop 1.7s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4); } 15% { opacity: 1; transform: scale(1.15); } 25% { transform: scale(1); }
    80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px); } }

  #speedo { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); text-align: center; border-radius: 18px; padding: 4px 26px 8px;
    font-style: italic; pointer-events: none; min-width: 170px; }
  #kmh { font-size: clamp(44px, 9vw, 64px); font-weight: 900; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  #speedo .unit { font-size: 13px; color: #7df9ff; margin-top: -2px; }
  #nitroWrap { height: 8px; margin-top: 6px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; }
  #nitroBar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff9100, #ff1744); }
  #speedfx { position: fixed; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0) 45%, rgba(160,220,255,.55) 100%); }
  #flash { position: fixed; inset: 0; pointer-events: none; background: #f00; opacity: 0; }
  #pausedLabel { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 56px; font-weight: bold;
    background: rgba(0,0,0,.5); pointer-events: none; }

  #touch { position: fixed; bottom: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; }
  #touch .grp { display: flex; gap: 12px; align-items: flex-end; }
  #touch button { pointer-events: auto; width: clamp(80px, 17vw, 118px); height: clamp(80px, 17vw, 118px); border-radius: 24px; font-size: 38px;
    border: 2px solid rgba(120,220,255,.8); background: rgba(8,10,30,.55); color: #fff; font-family: inherit; }
  #touch button.on { background: rgba(0,180,255,.55); }
  #touch .gas { border-color: #69f0ae; } #touch .brk { border-color: #ff5252; }
  .fx { position: fixed; font-size: 38px; pointer-events: none; animation: fly 1.4s ease-out forwards; }
  @keyframes fly { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) rotate(360deg) scale(1.3); opacity: 0; } }

  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: linear-gradient(rgba(10,10,40,.55), rgba(10,10,40,.8)); padding: 16px; overflow: auto; }
  #menu h1 { margin: 0; font-size: clamp(36px, 9vw, 72px); font-style: italic; font-weight: 900; letter-spacing: .04em;
    background: linear-gradient(90deg, #7df9ff, #ff80ab); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #menu .sub { color: #b3e5fc; font-size: clamp(14px, 3vw, 18px); }
  #best { color: #ffd54f; font-weight: bold; font-size: 18px; }
  #modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; width: min(820px, 100%); }
  .mode { border: 2px solid rgba(120,220,255,.7); border-radius: 16px; color: #fff; font-size: clamp(20px, 4vw, 26px); font-weight: bold;
    padding: 14px 8px; cursor: pointer; font-family: inherit; background: rgba(15,25,60,.8); }
  .mode:hover, .mode:active { background: rgba(0,150,220,.55); }
  .mode small { display: block; font-size: 13px; font-weight: normal; color: #b3e5fc; margin-top: 2px; }
  #menu .keys { font-size: 13px; color: #90a4ae; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="game"></div>
<div id="speedfx"></div><div id="flash"></div>

<div id="hud" class="hidden">
  <div id="top">
    <div id="stat" class="glass"><div id="score">000000</div><div id="combo">COMBO ×0</div><div id="stars">⭐ 0</div></div>
    <div id="qbox" class="glass hidden"><div id="qvis"></div><div id="qtext"></div></div>
    <div id="right" style="margin-left:auto">
      <button class="round" id="autoBtn">AUTO</button>
      <button class="round" id="speakBtn" title="もういちど">🔊</button>
      <button class="round" id="pause">⏸</button>
      <button class="round" id="homeBtn">🏠</button>
    </div>
  </div>
  <div id="msg"></div>
  <div id="speedo" class="glass"><div id="kmh">0</div><div class="unit">km/h</div><div id="nitroWrap"><div id="nitroBar"></div></div></div>
  <div id="touch" class="hidden">
    <div class="grp"><button id="tL">◀</button><button id="tR">▶</button></div>
    <div class="grp"><button id="tBrk" class="brk">BRAKE</button><button id="tGas" class="gas">GAS</button></div>
  </div>
  <div id="pausedLabel" class="hidden">⏸ PAUSE</div>
</div>

<div id="menu">
  <h1>TURBO DRIVE</h1>
  <div class="sub">走りながら ゲートで こたえよう。せいかいで ニトロ発動！</div>
  <div id="best"></div>
  <div id="modes">
    <button class="mode" data-mode="mul">✖️ かけざん（九九）<small>7×8 ＝ ？</small></button>
    <button class="mode" data-mode="calc">➕➖ 2けたの たし算・ひき算<small>くり上がり・くり下がりも</small></button>
    <button class="mode" data-mode="kanji">字 かん字の よみ<small>1・2年生の かん字</small></button>
    <button class="mode" data-mode="clock">🕒 とけい<small>なんじ なんぷん？</small></button>
    <button class="mode" data-mode="mix" style="grid-column: 1 / -1">🏁 ぜんぶ ミックス</button>
  </div>
  <div class="keys">
    ← → ハンドル ／ ↑ アクセル ／ ↓ ブレーキ ／ P ポーズ ／ AUTO ボタンで 自動アクセル<br>
    ゲームパッドも つかえます。もんだいは 🔊 で もういちど 読めます
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* ================= もんだい（小学2年生レベル） ================= */
const KANJI = [
  ['学校','がっこう'],['先生','せんせい'],['山','やま'],['川','かわ'],['空','そら'],['海','うみ'],['森','もり'],['雲','くも'],
  ['星','ほし'],['雨','あめ'],['雪','ゆき'],['花','はな'],['犬','いぬ'],['魚','さかな'],['鳥','とり'],['馬','うま'],
  ['牛','うし'],['車','くるま'],['電車','でんしゃ'],['男','おとこ'],['女','おんな'],['夏','なつ'],['春','はる'],['秋','あき'],
  ['冬','ふゆ'],['朝','あさ'],['夜','よる'],['国','くに'],['町','まち'],['村','むら'],['足','あし'],['手','て'],
  ['目','め'],['耳','みみ'],['口','くち'],['草','くさ'],['木','き'],['竹','たけ'],['石','いし'],['水','みず'],
  ['火','ひ'],['土','つち'],['金','かね'],['何','なに'],['毎日','まいにち'],['今日','きょう'],['text','']
].filter(k => k[1]);

function numChoices(ans, near) {
  const set = [ans];
  for (const c of shuffle(near)) { if (c >= 0 && !set.includes(c) && set.length < 3) set.push(c); }
  for (let d = 1; set.length < 3; d++) { const c = ans + (Math.random() < .5 ? d : -d); if (c >= 0 && !set.includes(c)) set.push(c); }
  return set.map(n => ({ label: String(n), say: String(n), correct: n === ans }));
}
function hissan(a, b, op, ans) {
  const w = String(Math.max(a, b, ans)).length + 1;
  return `<span class="hissan">${String(a).padStart(w, ' ')}\n${op}${String(b).padStart(w - 1, ' ')}\n${'─'.repeat(w)}</span>`;
}
function qMul(tier) {
  const a = pick(tier === 0 ? [2, 5, 3, 4] : [2, 3, 4, 5, 6, 7, 8, 9]);
  const b = rnd(tier === 0 ? 1 : 2, 9), ans = a * b;
  return { vis: `<span class="eq">${a} × ${b} ＝ ？</span>`, text: 'かけざん', say: `${a} かける ${b} は？`,
    choices: numChoices(ans, [ans + a, ans - a, ans + b, ans - b, ans + 10, ans - 10, ans + 1, ans - 1]), ansSay: String(ans) };
}
function qCalc(tier) {
  const sub = Math.random() < 0.5;
  let a, b, ans;
  if (!sub) {
    for (;;) {
      if (tier === 0) { a = rnd(10, 89); b = rnd(2, 89); if (a % 10 + b % 10 < 10 && a + b <= 99) break; }
      else if (tier === 1) { a = rnd(11, 89); b = rnd(11, 89); if (a % 10 + b % 10 >= 10 && a + b <= 99) break; }
      else { a = rnd(20, 99); b = rnd(20, 99); if (a + b > 100) break; }
    }
    ans = a + b;
  } else {
    for (;;) {
      if (tier === 0) { a = rnd(20, 99); b = rnd(2, a - 1); if (b % 10 <= a % 10) break; }
      else if (tier === 1) { a = rnd(21, 99); b = rnd(11, a - 1); if (b % 10 > a % 10) break; }
      else { a = rnd(100, 190); b = rnd(20, 99); if (a > b && b % 10 > a % 10) break; }
    }
    ans = a - b;
  }
  const op = sub ? '−' : '+';
  return { vis: `<span class="eq">${a} ${op} ${b} ＝ ？</span>${hissan(a, b, op, ans)}`, text: sub ? 'ひき算' : 'たし算',
    say: `${a} ${sub ? 'ひく' : 'たす'} ${b} は？`,
    choices: numChoices(ans, [ans + 10, ans - 10, ans + 1, ans - 1, ans + 2, ans - 2, ans + 20, ans - 20]), ansSay: String(ans) };
}
function qKanji() {
  const w = pick(KANJI);
  const three = [w];
  const used = new Set([w[1]]);
  for (const x of shuffle(KANJI)) { if (three.length >= 3) break; if (!used.has(x[1])) { used.add(x[1]); three.push(x); } }
  return { vis: `<span class="kanji">${w[0]}</span>`, text: 'この かん字の よみかたは？', say: 'この かんじの よみかたは？',
    choices: three.map(x => ({ label: x[1], say: x[1], correct: x === w })), ansSay: w[1] };
}
function timeLabel(h, m, half) {
  if (m === 0) return `${h}じ`;
  if (m === 30 && half) return `${h}じはん`;
  return `${h}じ${m}${m % 10 === 5 ? 'ふん' : 'ぷん'}`;
}
function clockSVG(h, m) {
  const ha = ((h % 12) + m / 60) * 30, ma = m * 6;
  let s = `<svg viewBox="-60 -60 120 120"><circle r="57" fill="#fff" stroke="#7df9ff" stroke-width="4"/>`;
  for (let i = 1; i <= 12; i++) {
    const t = i * Math.PI / 6;
    s += `<text x="${(Math.sin(t) * 43).toFixed(1)}" y="${(-Math.cos(t) * 43 + 4.5).toFixed(1)}" font-size="13" font-weight="bold" text-anchor="middle" fill="#263238">${i}</text>`;
  }
  s += `<line x1="0" y1="0" x2="0" y2="-28" stroke="#d81b60" stroke-width="5" stroke-linecap="round" transform="rotate(${ha})"/>`;
  s += `<line x1="0" y1="0" x2="0" y2="-42" stroke="#1565c0" stroke-width="3.5" stroke-linecap="round" transform="rotate(${ma})"/>`;
  return s + `<circle r="3.5" fill="#263238"/></svg>`;
}
function qClock(tier) {
  const h = rnd(1, 12), m = tier === 0 ? pick([0, 30]) : pick([0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]);
  const half = tier === 0;
  const lab = (hh, mm) => timeLabel(((hh + 11) % 12) + 1, mm, half);
  const ans = lab(h, m);
  const cands = [[h + 1, m], [h - 1, m], [h, (m + 30) % 60], [h, (m + 5) % 60], [h, (m + 55) % 60], [m === 0 ? 12 : m / 5, (h * 5) % 60]];
  const set = [ans];
  for (const [hh, mm] of shuffle(cands)) { const l = lab(hh, mm); if (!set.includes(l) && set.length < 3) set.push(l); }
  return { vis: clockSVG(h, m), text: 'なんじ なんぷん？', say: 'なんじ なんぷんかな？',
    choices: set.map(l => ({ label: l, say: l, correct: l === ans })), ansSay: ans };
}
function makeQuestion(mode, tier) {
  if (mode === 'mix') mode = pick(['mul', 'calc', 'kanji', 'clock']);
  return mode === 'mul' ? qMul(tier) : mode === 'calc' ? qCalc(tier) : mode === 'kanji' ? qKanji() : qClock(tier);
}

/* ================= おんせい・こうかおん ================= */
let jaVoice = null;
function loadVoice() { if (window.speechSynthesis) jaVoice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang)) || null; }
if (window.speechSynthesis) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function say(t) {
  if (!window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'ja-JP'; u.rate = 0.95; if (jaVoice) u.voice = jaVoice; speechSynthesis.speak(u); } catch (e) {}
}
let ac = null, engOsc = null, engGain = null;
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    engOsc = ac.createOscillator(); engOsc.type = 'sawtooth';
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    engGain = ac.createGain(); engGain.gain.value = 0;
    engOsc.connect(f); f.connect(engGain); engGain.connect(ac.destination); engOsc.start();
  } catch (e) { ac = null; }
}
function tone(freq, dur, type, vol, toFreq) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type || 'sine'; o.frequency.value = freq;
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, ac.currentTime + dur);
  g.gain.value = vol || .12; g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur);
}
function noise(dur, vol) {
  if (!ac) return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; g.gain.value = vol || .3; s.connect(g); g.connect(ac.destination); s.start();
}
const sfxOk = () => { tone(660, .12, 'square', .08); setTimeout(() => tone(990, .25, 'square', .08), 110); setTimeout(() => tone(1320, .35, 'square', .08), 230); };
const sfxNitro = () => { tone(200, 1.2, 'sawtooth', .1, 1200); noise(1.0, .15); };
const sfxCrash = () => { noise(.5, .5); tone(120, .4, 'sawtooth', .2, 40); };
const sfxNg = () => tone(220, .4, 'square', .1, 120);

/* ================= 3D ================= */
const LANES = [-8, 0, 8];                 // ゲートの よこいち
const TRAFFIC_LANES = [-9, -3, 3, 9];
const BOARD_COLORS = ['#e53935', '#1e88e5', '#fb8c00'];
const CAR_COLORS = ['#e53935', '#1e88e5', '#fdd835', '#43a047', '#8e24aa', '#fb8c00', '#ec407a', '#00acc1', '#eceff1'];
const LOOP = 300;
let curve = 0, curveTarget = 0, curveT = 4;
const bend = z => curve * z * z * 0.0005;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
$('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const FOG = 0x4a2a6e;
scene.fog = new THREE.Fog(FOG, 60, 280);
{ // ゆうやけ
  const c = document.createElement('canvas'); c.width = 2; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#070722'); gr.addColorStop(.35, '#2a1760'); gr.addColorStop(.5, '#7b2d7e'); gr.addColorStop(.58, '#ff6f6f'); gr.addColorStop(.64, '#ffb36b'); gr.addColorStop(1, '#2a1a4a');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256); scene.background = new THREE.CanvasTexture(c);
}
const camera = new THREE.PerspectiveCamera(65, 1, 0.5, 450);
scene.add(new THREE.HemisphereLight(0xb39ddb, 0x202040, 1.0));
const sun = new THREE.DirectionalLight(0xffa77a, 0.6); sun.position.set(-20, 30, -40); scene.add(sun);

let baseFov = 65;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; baseFov = w / h < 1 ? 85 : 65; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.MeshLambertMaterial({ color: 0x1a1f33 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.1; scene.add(ground);

// まがる どうろ（ちょうてんを まいフレーム ずらす）
const strips = [];
function makeStrip(width, lx, color, y, basic) {
  const len = 460, segs = 80;
  const g = new THREE.PlaneGeometry(width, len, 1, segs); g.rotateX(-Math.PI / 2); g.translate(0, 0, -len / 2 + 40);
  const p = g.attributes.position, bx = [], zs = [];
  for (let i = 0; i < p.count; i++) { bx.push(p.getX(i)); zs.push(p.getZ(i)); }
  const m = new THREE.Mesh(g, basic ? new THREE.MeshBasicMaterial({ color }) : new THREE.MeshLambertMaterial({ color }));
  m.position.y = y; m.frustumCulled = false; scene.add(m); strips.push({ g, bx, zs, lx });
}
function updateStrips() {
  for (const s of strips) {
    const p = s.g.attributes.position;
    for (let i = 0; i < p.count; i++) p.setX(i, s.bx[i] + s.lx + bend(s.zs[i]));
    p.needsUpdate = true;
  }
}
makeStrip(24, 0, 0x2b2f3a, 0, false);
makeStrip(0.35, -11.2, 0xffffff, 0.04, true); makeStrip(0.35, 11.2, 0xffffff, 0.04, true);
makeStrip(0.7, -12.2, 0x18ffff, 0.05, true); makeStrip(0.7, 12.2, 0xff4081, 0.05, true);

// うしろへ ながれるもの
const items = [];
function addItem(mesh, lx, z, y) { mesh.position.y = y || 0; scene.add(mesh); items.push({ m: mesh, lx, z }); }
function updateItems(dz) {
  for (const it of items) {
    it.z += dz; if (it.z > 40) it.z -= LOOP;
    it.m.position.x = it.lx + bend(it.z); it.m.position.z = it.z;
  }
}
const dashG1 = new THREE.PlaneGeometry(0.35, 4), dashM1 = new THREE.MeshBasicMaterial({ color: 0xffffff });
const dashG2 = new THREE.PlaneGeometry(0.4, 4), dashM2 = new THREE.MeshBasicMaterial({ color: 0xffc400 });
for (const lx of [-6, 6]) for (let i = 0; i < LOOP / 10; i++) {
  const d = new THREE.Mesh(dashG1, dashM1);
  d.rotation.x = -Math.PI / 2; addItem(d, lx, 40 - i * 10, 0.03);
}
for (let i = 0; i < LOOP / 10; i++) {
  const d = new THREE.Mesh(dashG2, dashM2);
  d.rotation.x = -Math.PI / 2; addItem(d, 0, 40 - i * 10, 0.03);
}
// まどあかりの ビル
const winTex = [];
for (let k = 0; k < 4; k++) {
  const c = document.createElement('canvas'); c.width = 64; c.height = 128; const g = c.getContext('2d');
  g.fillStyle = ['#12142e', '#1a1233', '#101c33', '#1c1a2e'][k]; g.fillRect(0, 0, 64, 128);
  for (let y = 4; y < 124; y += 8) for (let x = 4; x < 60; x += 8) {
    if (Math.random() < .55) { g.fillStyle = pick(['#ffe082', '#fff8e1', '#80deea', '#ffcc80']); g.fillRect(x, y, 4, 5); }
  }
  winTex.push(new THREE.CanvasTexture(c));
}
for (let i = 0; i < 70; i++) {
  const side = i % 2 ? 1 : -1, w = rnd(10, 22), h = rnd(18, 80), d = rnd(10, 22);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ map: pick(winTex) }));
  addItem(m, side * rnd(24, 70), 40 - (i / 70) * LOOP, h / 2);
}
for (let i = 0; i < 28; i++) {   // がいとう
  const side = i % 2 ? 1 : -1, g = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 9, 6), new THREE.MeshBasicMaterial({ color: 0x555a70 })); pole.position.y = 4.5; g.add(pole);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 6), new THREE.MeshBasicMaterial({ color: 0xffe9a8 })); lamp.position.y = 9.2; g.add(lamp);
  const halo = new THREE.Mesh(new THREE.CircleGeometry(2.2, 16), new THREE.MeshBasicMaterial({ color: 0xffd180, transparent: true, opacity: .25 })); halo.position.set(0, 9.2, 0.1); g.add(halo);
  addItem(g, side * 14.5, 40 - (i / 14 | 0) * 22 - (i % 2) * 2, 0);
}

// くるま
function makeCar(color, sporty) {
  const g = new THREE.Group(), mat = new THREE.MeshLambertMaterial({ color });
  const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 4.6), mat); body.position.y = 0.65; g.add(body);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.55, 2.0), new THREE.MeshLambertMaterial({ color: 0x0d1b2a })); cab.position.set(0, 1.2, 0.35); g.add(cab);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.1, 1.5), mat); roof.position.set(0, 1.52, 0.35); g.add(roof);
  const tail = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.16, 0.08), new THREE.MeshBasicMaterial({ color: 0xff1744 })); tail.position.set(0, 0.85, 2.32); g.add(tail);
  for (const x of [-0.75, 0.75]) {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.18, 0.08), new THREE.MeshBasicMaterial({ color: 0xfffde7 })); l.position.set(x, 0.8, -2.32); g.add(l);
  }
  const wheels = [], wg = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 14); wg.rotateZ(Math.PI / 2);
  for (const [x, z] of [[-1.15, -1.5], [1.15, -1.5], [-1.15, 1.5], [1.15, 1.5]]) {
    const w = new THREE.Mesh(wg, new THREE.MeshLambertMaterial({ color: 0x111111 })); w.position.set(x, 0.5, z); g.add(w); wheels.push(w);
  }
  if (sporty) {
    const wing = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.08, 0.55), mat); wing.position.set(0, 1.5, 2.1); g.add(wing);
    for (const x of [-0.8, 0.8]) { const p = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.4, 0.1), mat); p.position.set(x, 1.3, 2.05); g.add(p); }
    const glow = new THREE.Mesh(new THREE.PlaneGeometry(2.9, 5.6), new THREE.MeshBasicMaterial({ color: 0x18ffff, transparent: true, opacity: .18, blending: THREE.AdditiveBlending, depthWrite: false }));
    glow.rotation.x = -Math.PI / 2; glow.position.y = 0.12; g.add(glow);
    const beam = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 14), new THREE.MeshBasicMaterial({ color: 0xfff3c4, transparent: true, opacity: .05, blending: THREE.AdditiveBlending, depthWrite: false }));
    beam.rotation.x = -Math.PI / 2; beam.position.set(0, 0.1, -9); g.add(beam);

}
const player = makeCar(CAR_COLORS[0], true);
scene.add(player.g);

// ゲート
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function boardTex(label, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 360; const g = c.getContext('2d');
  g.fillStyle = '#fff'; roundRect(g, 0, 0, 512, 360, 44); g.fill();
  g.fillStyle = color; roundRect(g, 14, 14, 484, 332, 34); g.fill();
  const n = [...label].length, size = n <= 2 ? 230 : n === 3 ? 170 : n === 4 ? 130 : n === 5 ? 105 : n === 6 ? 90 : 78;
  g.fillStyle = '#fff'; g.font = `bold ${size}px "Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 12; g.strokeStyle = 'rgba(0,0,0,.3)'; g.strokeText(label, 256, 190); g.fillText(label, 256, 190);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
const postMat = new THREE.MeshBasicMaterial({ color: 0xcfd8dc });
function makeGate(choice, idx) {
  const g = new THREE.Group();
  const board = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 4.5), new THREE.MeshBasicMaterial({ map: boardTex(choice.label, BOARD_COLORS[idx]) })); board.position.y = 5.2; g.add(board);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 5.3), new THREE.MeshBasicMaterial({ color: 0xffeb3b })); glow.position.set(0, 5.2, -0.05); glow.visible = false; g.add(glow);
  for (const x of [-2.9, 2.9]) { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 5.6, 8), postMat); p.position.set(x, 2.8, 0); g.add(p); }
  g.position.x = LANES[idx]; g.userData = { choice, glow, board }; return g;
}
function disposeWave(w) {
  w.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material !== postMat) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
  scene.remove(w);
}

/* ================= ゲームじょうたい ================= */
let mode = null, playing = false, paused = false, auto = true;
let v = 26, carX = 0, steerV = 0, nitroT = 0, score = 0, combo = 0, shake = 0, invul = 0, clock = 0;
let q = null, wrongCount = 0, retry = false, waves = [], traffic = [], phase = 'drive', phaseT = 0, spawnT = 0, sessionCorrect = 0;
let stars = 0, best = 0;
try { stars = parseInt(localStorage.getItem('turbo.stars') || '0', 10) || 0; best = parseInt(localStorage.getItem('turbo.best') || '0', 10) || 0; } catch (e) {}
const tier = () => Math.min(2, Math.floor(sessionCorrect / 4));

function applyCarColor() { player.mat.color.set(CAR_COLORS[Math.floor(stars / 5) % CAR_COLORS.length]); }
function renderStats() {
  $('stars').textContent = '⭐ ' + stars; $('score').textContent = String(Math.floor(score)).padStart(6, '0');
  $('combo').textContent = 'COMBO ×' + combo; $('best').textContent = best ? `🏆 ベストスコア ${best}　⭐ ${stars}` : `⭐ ${stars}`;
}
applyCarColor(); renderStats();

function showMsg(text, color) {
  const m = $('msg'); m.textContent = text; m.style.color = color || '#fff'; m.classList.remove('show'); void m.offsetWidth; m.classList.add('show');
}
function burst(emojis, n) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('div'); s.className = 'fx'; s.textContent = pick(emojis);
    s.style.left = (30 + Math.random() * 40) + '%'; s.style.top = (40 + Math.random() * 20) + '%';
    s.style.setProperty('--dx', (Math.random() * 600 - 300) + 'px'); s.style.setProperty('--dy', (-100 - Math.random() * 350) + 'px');
    document.body.appendChild(s); setTimeout(() => s.remove(), 1500);
  }
}

function spawnWave(hint) {
  const wave = new THREE.Group();
  shuffle(q.choices).forEach((c, i) => { const g = makeGate(c, i); if (hint && c.correct) g.userData.glow.visible = true; wave.add(g); });
  wave.userData = { z: -320, gates: wave.children.slice(), judged: false };
  scene.add(wave); waves.push(wave);
}
function startQuiz() {
  traffic = traffic.filter(t => { if (t.z < -170) { scene.remove(t.car.g); return false; } return true; });
  if (!retry) { q = makeQuestion(mode, tier()); wrongCount = 0; }
  $('qvis').innerHTML = q.vis; $('qtext').textContent = q.text; $('qbox').classList.remove('hidden');
  spawnWave(wrongCount >= 2); say(q.say); phase = 'approach';
}
function judge(wave) {
  wave.userData.judged = true;
  let idx = 0, best_ = 1e9;
  LANES.forEach((x, i) => { const d = Math.abs(carX - x); if (d < best_) { best_ = d; idx = i; } });
  const ok = wave.userData.gates[idx].userData.choice.correct;
  phase = 'drive'; spawnT = 0; $('qbox').classList.add('hidden');
  if (ok) {
    sessionCorrect++; stars++; combo++; retry = false;
    score += 100 * (1 + Math.min(combo - 1, 5) * 0.5);
    nitroT = 4; sfxOk(); setTimeout(sfxNitro, 300);
    try { localStorage.setItem('turbo.stars', String(stars)); } catch (e) {}
    const changed = stars % 5 === 0; if (changed) applyCarColor();
    showMsg(combo >= 2 ? `NITRO! ×${combo}` : 'NITRO!', '#ffd740'); burst(['⭐', '🔥', '✨'], changed ? 34 : 14);
    say(`せいかい！ こたえは ${q.ansSay}`);
    if (changed) setTimeout(() => showMsg('くるまの いろが かわった！', '#fff'), 1800);
    phaseT = 5;
  } else {
    wrongCount++; combo = 0; retry = true; v *= 0.5; shake = .7; sfxNg();
    showMsg('MISS!', '#ff5252'); say('おしい！ もういちど');
    phaseT = 4;
  }
  renderStats();
}

function spawnTraffic() {
  const occupied = new Set(traffic.filter(t => t.z < -140 && !t.hit).map(t => t.lane));
  if (occupied.size >= 3) return;
  const free = TRAFFIC_LANES.map((x, i) => i).filter(i => !occupied.has(i)); const lane = pick(free);
  const car = makeCar(pick([0x90a4ae, 0xeceff1, 0x546e7a, 0xffb300, 0x7e57c2, 0x26a69a, 0xef5350]), false);
  if (Math.random() < .25) { car.g.scale.set(1.1, 1.4, 1.5); }
  scene.add(car.g);
  traffic.push({ car, lane, lx: TRAFFIC_LANES[lane], z: -230, s: rnd(16, 30), hit: false, vx: 0 });
}

function startMode(m) {
  audioInit(); mode = m; playing = true; paused = false; sessionCorrect = 0; combo = 0; score = 0; v = 20; carX = 0; nitroT = 0; retry = false;
  waves.forEach(disposeWave); waves = []; traffic.forEach(t => scene.remove(t.car.g)); traffic = [];
  phase = 'drive'; phaseT = 3; spawnT = 0;
  $('menu').classList.add('hidden'); $('hud').classList.remove('hidden'); $('pausedLabel').classList.add('hidden'); $('qbox').classList.add('hidden');
  $('touch').classList.toggle('hidden', !matchMedia('(pointer: coarse)').matches);
  $('autoBtn').classList.toggle('on', auto); renderStats();
}
function goMenu() {
  playing = false; if (window.speechSynthesis) speechSynthesis.cancel();
  if (score > best) { best = Math.floor(score); try { localStorage.setItem('turbo.best', String(best)); } catch (e) {} }
  waves.forEach(disposeWave); waves = []; traffic.forEach(t => scene.remove(t.car.g)); traffic = [];
  $('hud').classList.add('hidden'); $('menu').classList.remove('hidden'); renderStats();
}

/* ================= そうさ ================= */
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => startMode(b.dataset.mode)));
$('homeBtn').addEventListener('click', goMenu);
$('speakBtn').addEventListener('click', () => q && say(q.say));
function togglePause() { if (!playing) return; paused = !paused; $('pausedLabel').classList.toggle('hidden', !paused); $('pause').textContent = paused ? '▶' : '⏸'; }
$('pause').addEventListener('click', togglePause);
$('autoBtn').addEventListener('click', () => { auto = !auto; $('autoBtn').classList.toggle('on', auto); });
const key = { l: 0, r: 0, gas: 0, brk: 0 }, tch = { l: 0, r: 0, gas: 0, brk: 0 };
function hold(id, k) {
  const el = $(id), on = e => { e.preventDefault(); tch[k] = 1; el.classList.add('on'); audioInit(); }, off = e => { e.preventDefault(); tch[k] = 0; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => el.addEventListener(ev, off));
}
hold('tL', 'l'); hold('tR', 'r'); hold('tGas', 'gas'); hold('tBrk', 'brk');
const KMAP = { ArrowLeft: 'l', a: 'l', A: 'l', ArrowRight: 'r', d: 'r', D: 'r', ArrowUp: 'gas', w: 'gas', W: 'gas', ArrowDown: 'brk', s: 'brk', S: 'brk' };
addEventListener('keydown', e => { if (KMAP[e.key]) { key[KMAP[e.key]] = 1; e.preventDefault(); } if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause(); });
addEventListener('keyup', e => { if (KMAP[e.key]) key[KMAP[e.key]] = 0; });

/* ================= ループ ================= */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  clock += dt;

  // ゲームパッド
  let gpSteer = 0, gpGas = 0, gpBrk = 0;
  const gp = navigator.getGamepads && navigator.getGamepads()[0];
  if (gp) { const ax = gp.axes[0] || 0; gpSteer = Math.abs(ax) > .15 ? ax : 0; gpGas = (gp.buttons[7] && gp.buttons[7].value) || (gp.buttons[0] && gp.buttons[0].pressed ? 1 : 0); gpBrk = (gp.buttons[6] && gp.buttons[6].value) || (gp.buttons[1] && gp.buttons[1].pressed ? 1 : 0); }

  const active = playing && !paused;
  let steer = 0;
  if (active) {
    steer = clamp((key.r - key.l) + (tch.r - tch.l) + gpSteer, -1, 1);
    const gasIn = key.gas || tch.gas || gpGas, brk = key.brk || tch.brk || gpBrk;
    if (nitroT > 0) { nitroT -= dt; v = Math.min(v + 38 * dt, 78); }
    else {
      const cap = auto ? 42 : 55;
      if (brk) v -= 38 * dt; else if (gasIn || (auto && v < cap)) v += 16 * dt; else v -= 4 * dt;
      if (v > cap) v -= 14 * dt; if (gasIn && !auto && v > cap) v = cap;
    }
    v = clamp(v, 0, 78);
    // ハンドルと カーブの ひっぱり
    steerV += (steer * 14 - steerV) * Math.min(1, 9 * dt);
    carX += steerV * dt * (0.35 + 0.65 * Math.min(1, v / 20)) - curve * v * 0.075 * dt;
    if (Math.abs(carX) > 10.6) { carX = clamp(carX, -10.6, 10.6); v -= 22 * dt; shake = Math.max(shake, .25); }
    score += v * dt * 0.1;

    const dz = v * dt;
    updateItems(dz);
    player.wheels.forEach(w => w.rotation.x -= dz / 0.5);

    // フェーズ
    phaseT -= dt;
    if (phase === 'drive') {
      spawnT -= dt; if (spawnT <= 0) { spawnTraffic(); spawnT = 0.9 + Math.random() * 0.8; }
      if (phaseT <= 0) startQuiz();
    }
    // こうつう
    invul -= dt;
    for (let i = traffic.length - 1; i >= 0; i--) {
      const t = traffic[i]; t.z += (v - t.s) * dt; t.lx += t.vx * dt;
      if (t.hit) { t.car.g.rotation.y += 4 * dt * Math.sign(t.vx || 1); t.car.g.rotation.z += 2 * dt; }
      t.car.g.position.set(t.lx + bend(t.z), 0, t.z);
      if (!t.hit && invul <= 0 && Math.abs(t.z) < 4.8 && Math.abs(t.lx - carX) < 2.3) {
        t.hit = true; t.vx = (t.lx >= carX ? 1 : -1) * 9; t.s *= .3; v *= 0.45; combo = 0; shake = 1; invul = 1;
        sfxCrash(); $('flash').style.opacity = .5; renderStats();
      }
      t.car.wheels.forEach(w => w.rotation.x -= (t.s) * dt / 0.5);
      if (t.z > 30 || t.z < -340) { scene.remove(t.car.g); traffic.splice(i, 1); }
    }
    // ゲート
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i], d = w.userData; d.z += dz;
      w.position.set(bend(d.z), 0, d.z);
      if (!d.judged && d.z > -1) judge(w);
      w.visible = d.z < 8;
      d.gates.forEach(g => { if (g.userData.glow.visible) g.userData.board.scale.setScalar(1 + 0.06 * Math.sin(clock * 8)); });
      if (d.z > 30) { disposeWave(w); waves.splice(i, 1); }
    }
    // カーブ
    curveT -= dt;
    if (curveT <= 0) { const lim = phase === 'approach' ? .3 : .9; curveTarget = (Math.random() * 2 - 1) * lim; curveT = rnd(6, 10); }
    if (phase === 'approach' && Math.abs(curveTarget) > .3) curveTarget = clamp(curveTarget, -.3, .3);
    curve += (curveTarget - curve) * 0.4 * dt;
  } else if (!playing) {
    // メニューの はいけい
    v = 28; updateItems(v * dt); player.wheels.forEach(w => w.rotation.x -= v * dt / 0.5);
    curveT -= dt; if (curveT <= 0) { curveTarget = (Math.random() * 2 - 1) * .6; curveT = 6; } curve += (curveTarget - curve) * 0.4 * dt;
  }
  updateStrips();

  // くるまの ひょうじ
  player.g.position.x = (playing ? carX : 0) + bend(0);
  player.g.rotation.y += (-steerV * 0.018 - player.g.rotation.y) * 0.2;
  player.g.position.y = active ? Math.sin(clock * 38) * 0.015 * Math.min(1, v / 20) : 0;
  shake = Math.max(0, shake - dt * 1.6);
  const sx = (Math.random() - .5) * shake * 0.6, sy = (Math.random() - .5) * shake * 0.4;
  camera.position.set(player.g.position.x * 0.85 + sx, 4.6 + sy + (nitroT > 0 ? -0.3 : 0), 9.5);
  camera.lookAt(player.g.position.x * 0.5 + bend(-45) * 0.7, 2.3, -30);
  const kmh = Math.round(v * 3.6);
  camera.fov += ((baseFov + clamp(v - 20, 0, 60) * 0.28 + (nitroT > 0 ? 10 : 0)) - camera.fov) * 0.1; camera.updateProjectionMatrix();

  // HUD・おと
  if (playing) {
    $('kmh').textContent = kmh; $('nitroBar').style.width = (nitroT > 0 ? nitroT / 4 * 100 : 0) + '%';
    $('speedfx').style.opacity = clamp((v - 35) / 40, 0, .85);
    const f = parseFloat($('flash').style.opacity) || 0; if (f > 0) $('flash').style.opacity = Math.max(0, f - dt * 1.5);
    $('score').textContent = String(Math.floor(score)).padStart(6, '0');
  }
  if (ac && engOsc) { engOsc.frequency.value = 45 + v * 2.4; engGain.gain.value = active ? 0.05 + v / 78 * 0.03 : 0; }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
})();
</script>
