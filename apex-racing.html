<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>APEX RACING</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d14; color: #fff; touch-action: none;
    font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }
  .panel { background: rgba(10,12,22,.62); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; backdrop-filter: blur(5px); }
  .it { font-style: italic; font-weight: 800; }

  #pos { position: fixed; top: 14px; left: 14px; padding: 8px 16px; line-height: 1; }
  #pos .big { font-size: 54px; color: #ffca28; } #pos .big small { font-size: 26px; color: #fff; }
  #pos .lap { font-size: 20px; margin-top: 4px; color: #b0bec5; }
  #times { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); padding: 6px 18px; text-align: center; font-variant-numeric: tabular-nums; }
  #times .cur { font-size: 30px; } #times .sub { font-size: 14px; color: #90a4ae; }
  #miniWrap { position: fixed; top: 14px; right: 14px; padding: 6px; }
  #mini { display: block; width: 170px; height: 170px; }

  #speedo { position: fixed; right: 16px; bottom: 14px; padding: 8px 18px 10px; min-width: 210px; text-align: right; }
  #kmh { font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; }
  #speedo .u { font-size: 14px; color: #90a4ae; margin-left: 4px; }
  #gear { font-size: 30px; color: #ffca28; float: left; margin-top: 18px; }
  #rpm { height: 8px; background: rgba(255,255,255,.14); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  #rpmBar { height: 100%; width: 0; background: linear-gradient(90deg, #26c6da, #ffee58 70%, #ff1744); }
  #drift { position: fixed; left: 16px; bottom: 14px; padding: 8px 14px; width: 230px; }
  #drift .t { font-size: 13px; color: #90a4ae; letter-spacing: .1em; }
  #driftBar { height: 12px; background: rgba(255,255,255,.14); border-radius: 6px; overflow: hidden; margin: 4px 0; }
  #driftFill { height: 100%; width: 0; background: #29b6f6; }
  #driftScore { font-size: 22px; color: #ff80ab; }
  #msg { position: fixed; top: 28%; left: 0; right: 0; text-align: center; font-size: clamp(40px, 9vw, 96px); pointer-events: none;
    text-shadow: 0 0 24px currentColor, 0 4px 0 rgba(0,0,0,.4); opacity: 0; }
  #msg.show { animation: pop 1.5s ease-out; } #msg.sticky { opacity: 1; animation: none; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.5); } 15% { opacity: 1; transform: scale(1.12); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  #speedfx { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,255,255,0) 50%, rgba(190,225,255,.5) 100%); }
  #flash { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
  #sys { position: fixed; top: 14px; right: 200px; display: flex; gap: 8px; }
  .rb { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.4); background: rgba(10,12,22,.6); color: #fff; font-size: 17px; cursor: pointer; }
  @media (max-width: 760px) { #sys { top: 196px; right: 14px; } #mini { width: 130px; height: 130px; } #pos .big { font-size: 40px; } }
  #pause { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 56px; background: rgba(0,0,0,.5); pointer-events: none; }
  #touch { position: fixed; bottom: 150px; left: 14px; right: 14px; display: flex; justify-content: space-between; pointer-events: none; }
  #touch .g { display: flex; gap: 10px; align-items: flex-end; }
  #touch button { pointer-events: auto; width: 82px; height: 82px; border-radius: 22px; font-size: 16px; font-weight: bold; font-family: inherit;
    border: 2px solid rgba(255,255,255,.6); background: rgba(10,12,22,.5); color: #fff; }
  #touch button.on { background: rgba(0,170,255,.6); }

  #menu, #result { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; overflow: auto;
    background: radial-gradient(ellipse at 30% 20%, rgba(255,120,40,.18), rgba(5,8,18,.82) 60%); }
  #menu h1 { margin: 0; font-size: clamp(44px, 10vw, 92px); letter-spacing: .06em; background: linear-gradient(90deg, #ffca28, #ff5252); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #menu .sub { color: #b0bec5; letter-spacing: .3em; font-size: 13px; margin-top: -10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .opt { min-width: 150px; padding: 12px 16px; border-radius: 10px; border: 2px solid rgba(255,255,255,.2); background: rgba(20,24,40,.8); color: #fff; font-size: 16px; font-family: inherit; cursor: pointer; text-align: center; }
  .opt small { display: block; color: #90a4ae; font-size: 12px; margin-top: 3px; }
  .opt.sel { border-color: #ffca28; background: rgba(255,202,40,.16); }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .sw.sel { border-color: #fff; }
  #go, .big-btn { padding: 16px 56px; font-size: 26px; border-radius: 12px; border: none; cursor: pointer; background: linear-gradient(#ff7043, #e53935); color: #fff; font-family: inherit; box-shadow: 0 6px 0 #8e1b14; }
  #go:active, .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8e1b14; }
  #menu .keys { color: #78909c; font-size: 13px; line-height: 1.7; text-align: center; }
  #best { color: #ffca28; font-size: 15px; }
  #resBox { padding: 18px 28px; min-width: min(420px, 92vw); } #resBox h2 { margin: 0 0 10px; font-size: 40px; color: #ffca28; }
  #resBox table { width: 100%; font-variant-numeric: tabular-nums; font-size: 18px; border-collapse: collapse; } #resBox td { padding: 3px 4px; } #resBox td:last-child { text-align: right; }
</style>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{overscroll-behavior:none;-webkit-touch-callout:none;position:fixed;width:100%;touch-action:none}button,canvas,div{touch-action:none;-webkit-touch-callout:none}</style>
</head>
<body>
<div id="game"></div>
<div id="speedfx"></div><div id="flash"></div>

<div id="hud" class="hidden">
  <div id="pos" class="panel it"><div class="big"><span id="posN">1</span><small>/<span id="posT">6</span></small></div><div class="lap">LAP <span id="lapN">1</span>/<span id="lapT">3</span></div></div>
  <div id="times" class="panel"><div class="cur it" id="tCur">0:00.00</div><div class="sub">LAST <span id="tLast">--</span> ／ BEST <span id="tBest">--</span></div></div>
  <div id="sys"><button class="rb hidden" id="tiltBtn" title="センター合わせ">🧭</button><button class="rb hidden" id="tiltInvBtn" title="傾きの向きを反転">🔄</button><button class="rb" id="bgmBtn" title="BGM(M)">🎵</button><button class="rb" id="camBtn" title="カメラ(C)">🎥</button><button class="rb" id="pauseBtn" title="ポーズ(P)">⏸</button><button class="rb" id="homeBtn" title="メニュー">✕</button></div>
  <div id="miniWrap" class="panel"><canvas id="mini" width="340" height="340"></canvas></div>
  <div id="drift" class="panel"><div class="t">DRIFT BOOST</div><div id="driftBar"><div id="driftFill"></div></div><div class="it" id="driftScore">0</div></div>
  <div id="speedo" class="panel it"><span id="gear">N</span><span id="kmh">0</span><span class="u">km/h</span><div id="rpm"><div id="rpmBar"></div></div></div>
  <div id="msg" class="it"></div>
  <div id="touch" class="hidden">
    <div class="g"><button id="tL">◀</button><button id="tR">▶</button></div>
    <div class="g"><button id="tHB">DRIFT</button><button id="tBrk">BRAKE</button><button id="tGas">GAS</button></div>
  </div>
  <div id="pause" class="it hidden">PAUSE</div>
</div>

<div id="menu">
  <h1 class="it">APEX RACING</h1>
  <div class="sub">3D CIRCUIT × DRIFT</div>
  <div id="best"></div>
  <div class="row" id="cars">
    <button class="opt sel" data-car="0">GT クーペ<small>バランス型</small></button>
    <button class="opt" data-car="1">スーパーカー<small>最高速・高グリップ</small></button>
    <button class="opt" data-car="2">ラリー<small>ドリフトしやすい</small></button>
  </div>
  <div class="row" id="colors"></div>
  <div class="row" id="modes">
    <button class="opt sel" data-mode="race">レース<small>AI 5台</small></button>
    <button class="opt" data-mode="ta">タイムアタック<small>ひとりで走る</small></button>
  </div>
  <div class="row" id="laps">
    <button class="opt sel" data-laps="3">3 周</button><button class="opt" data-laps="5">5 周</button><button class="opt" data-laps="1">1 周</button>
  </div>
  <div class="row" id="steerRow"><button class="opt sel" data-steer="btn">ボタンでハンドル</button><button class="opt" data-steer="tilt">傾きでハンドル<small>iPad・スマホを傾ける</small></button></div>
  <button id="go" class="it">START</button>
  <div class="keys">↑ / W アクセル　↓ / S ブレーキ・バック　← → / A D ハンドル<br>Space ハンドブレーキ（ドリフト）　C カメラ　M BGM　（iPad：傾きハンドル対応）　R コースに戻る　P ポーズ<br>ゲームパッド対応（スティック／RT／LT／Aボタン）</div>
</div>

<div id="result" class="hidden">
  <div id="resBox" class="panel"><h2 class="it" id="resTitle">FINISH</h2><table id="resTable"></table></div>
  <div class="row"><button class="big-btn it" id="again">もう一度</button><button class="big-btn it" id="toMenu" style="background:linear-gradient(#546e7a,#37474f);box-shadow:0 6px 0 #1c262b">メニュー</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const LOW = /[?&]low/.test(location.search);
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));

/* =============== コース生成（入り組んだ周回コース） =============== */
const ROAD_W = 18, WALL_D = ROAD_W / 2 + 7;
const TR = (() => {
  const g = (t, t0, s) => { const d = angDiff(t, t0); return Math.exp(-d * d / (2 * s * s)); };
  const bumps = [[1.0, .385, .28], [3.55, -.308, .238], [5.05, .352, .224], [2.3, -.198, .196]];
  const raw = t => {
    let r = 1 + .08 * Math.sin(2 * t + .5) + .07 * Math.sin(3 * t + 1.2) + .04 * Math.sin(5 * t);
    for (const b of bumps) r += b[1] * g(t, b[0], b[2]);
    return [Math.cos(t) * 420 * r, Math.sin(t) * 300 * r];
  };
  const M = 5000, P = []; for (let i = 0; i < M; i++) P.push(raw(i / M * 2 * Math.PI));
  const cum = [0]; for (let i = 1; i <= M; i++) { const a = P[i - 1], b = P[i % M]; cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); }
  const L = cum[M], N = Math.round(L / 4), ds = L / N;
  let S = [], j = 0;
  for (let k = 0; k < N; k++) { const s = k * ds; while (cum[j + 1] < s) j++; const f = (s - cum[j]) / (cum[j + 1] - cum[j]); const a = P[j], b = P[(j + 1) % M]; S.push([lerp(a[0], b[0], f), lerp(a[1], b[1], f)]); }
  for (let pass = 0; pass < 3; pass++) S = S.map((p, i) => { const a = S[(i - 1 + N) % N], b = S[(i + 1) % N]; return [p[0] * .5 + (a[0] + b[0]) * .25, p[1] * .5 + (a[1] + b[1]) * .25]; });
  const tan = (S0) => S0.map((p, i) => { const a = S0[(i - 1 + N) % N], b = S0[(i + 1) % N]; const dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz); return [dx / l, dz / l]; });
  let T = tan(S);
  // きょくりつ（符号つき: + = ひだりカーブ）
  let kap = S.map((p, i) => { const a = T[(i - 3 + N) % N], b = T[(i + 3) % N], nl = [T[i][1], -T[i][0]]; return ((b[0] - a[0]) * nl[0] + (b[1] - a[1]) * nl[1]) / (6 * ds); });
  // いちばん長い直線を スタートに
  let bi = 0, bv = 1e9;
  for (let i = 0; i < N; i++) { let m = 0; for (let k = -12; k <= 30; k++) m = Math.max(m, Math.abs(kap[(i + k + N) % N])); if (m < bv) { bv = m; bi = i; } }
  const rot = a => a.map((_, i) => a[(i + bi) % N]);
  S = rot(S); T = rot(T); kap = rot(kap);
  const o = { N, ds, L: N * ds, x: S.map(p => p[0]), z: S.map(p => p[1]), tx: T.map(p => p[0]), tz: T.map(p => p[1]), kap };
  o.nx = o.tz.slice(); o.nz = o.tx.map(v => -v);
  o.akap = kap.map(Math.abs);
  return o;
})();
const N = TR.N;
function trackAt(sf) {
  const i0 = Math.floor(sf), f = sf - i0, i = ((i0 % N) + N) % N, j = (i + 1) % N;
  let tx = lerp(TR.tx[i], TR.tx[j], f), tz = lerp(TR.tz[i], TR.tz[j], f); const l = Math.hypot(tx, tz); tx /= l; tz /= l;
  return { x: lerp(TR.x[i], TR.x[j], f), z: lerp(TR.z[i], TR.z[j], f), tx, tz, nx: tz, nz: -tx };
}

/* =============== レンダラ・シーン =============== */
const renderer = new THREE.WebGLRenderer({ antialias: !LOW });
renderer.setPixelRatio(LOW ? 1 : Math.min(devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
if (!LOW) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
$('game').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbcd3e6, 220, 1000);
const camera = new THREE.PerspectiveCamera(62, 1, .4, 3000);
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

function skyColors(geo, top, mid, bot) {
  const c = [], p = geo.attributes.position, tc = new THREE.Color(top), mc = new THREE.Color(mid), bc = new THREE.Color(bot), col = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const h = p.getY(i) / geo.parameters.radius; if (h > 0) col.copy(mc).lerp(tc, Math.pow(h, .55)); else col.copy(mc).lerp(bc, Math.min(1, -h * 3)); c.push(col.r, col.g, col.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
}
// かんきょうマップ（くるまの はんしゃ）
const envScene = new THREE.Scene();
{ const g = new THREE.SphereGeometry(50, 32, 16); skyColors(g, 0x3f86d6, 0xdfeaf5, 0x4b5a38);
  envScene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const sun = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); sun.position.set(-30, 30, -25); envScene.add(sun);
  const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(envScene, .03).texture; }
// そら
const skyGeo = new THREE.SphereGeometry(1800, 32, 16); skyColors(skyGeo, 0x2a6fd1, 0xcfe3f5, 0xb9cbd8);
const sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })); sky.renderOrder = -10; scene.add(sky);
function radialTex(inner, outer) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d'), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(1, outer); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c);
}
const SUN_DIR = new THREE.Vector3(-.45, .62, -.64).normalize();
const sunSpr = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex('rgba(255,250,230,1)', 'rgba(255,240,200,0)'), fog: false, depthWrite: false, transparent: true })); sunSpr.scale.set(420, 420, 1); scene.add(sunSpr);
const cloudTex = radialTex('rgba(255,255,255,.9)', 'rgba(255,255,255,0)'); const clouds = [];
for (let i = 0; i < 26; i++) { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTex, fog: false, depthWrite: false, transparent: true, opacity: rnd(.5, .9) }));
  const a = rnd(0, 6.28), e = rnd(.12, .45); s.position.set(Math.cos(a) * 1500 * Math.cos(e), 1500 * Math.sin(e), Math.sin(a) * 1500 * Math.cos(e)); s.scale.set(rnd(300, 600), rnd(90, 180), 1); scene.add(s); clouds.push(s); }

scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x5b6b45, .75));
const sunLight = new THREE.DirectionalLight(0xfff1d6, 2.2);
if (!LOW) { sunLight.castShadow = true; sunLight.shadow.mapSize.set(2048, 2048); const sc = sunLight.shadow.camera; sc.left = -40; sc.right = 40; sc.top = 40; sc.bottom = -40; sc.near = 1; sc.far = 300; sunLight.shadow.bias = -.0004; }
scene.add(sunLight); scene.add(sunLight.target);

/* =============== テクスチャ =============== */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; } return t;
}
const asphaltTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#3b3e44'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { const v = 40 + Math.random() * 40 | 0; g.fillStyle = `rgb(${v},${v + 2},${v + 6})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(150, 0, 60, h); g.fillRect(302, 0, 60, h);   // タイヤのあと
  g.fillStyle = '#e8e8e8'; g.fillRect(14, 0, 8, h); g.fillRect(w - 22, 0, 8, h);
}, true);
const grassTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4f7a3a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6000; i++) { const v = Math.random(); g.fillStyle = v < .5 ? 'rgba(40,80,30,.5)' : 'rgba(110,150,70,.4)'; g.fillRect(Math.random() * w, Math.random() * h, 2, 3); }
}, true); grassTex.repeat.set(300, 300);
const curbTex = canvasTex(64, 128, (g, w, h) => { g.fillStyle = '#d32f2f'; g.fillRect(0, 0, w, h / 2); g.fillStyle = '#f5f5f5'; g.fillRect(0, h / 2, w, h / 2); }, true);
const wallTex = canvasTex(256, 64, (g, w, h) => { g.fillStyle = '#eeeeee'; g.fillRect(0, 0, w, h); g.fillStyle = '#d32f2f'; g.fillRect(0, 0, w / 2, h); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(0, h - 10, w, 10); }, true);
const checkerTex = canvasTex(128, 32, (g, w, h) => { for (let y = 0; y < 4; y++) for (let x = 0; x < 16; x++) { g.fillStyle = (x + y) % 2 ? '#111' : '#fff'; g.fillRect(x * 8, y * 8, 8, 8); } }, true);
const crowdTex = canvasTex(256, 64, (g, w, h) => { g.fillStyle = '#3d414c'; g.fillRect(0, 0, w, h); for (let i = 0; i < 380; i++) { g.fillStyle = `hsl(${Math.random() * 360},35%,${30 + Math.random() * 18}%)`; g.fillRect(Math.random() * w, Math.random() * h, 3, 4); } }, true);

/* =============== コースを組み立てる =============== */
function makeStrip(fa, fb, vScale, mat, mask) {
  const pos = [], uv = [], idx = [];
  for (let i = 0; i <= N; i++) { const a = fa(i % N), b = fb(i % N), v = i * TR.ds / vScale; pos.push(...a, ...b); uv.push(0, v, 1, v); }
  for (let i = 0; i < N; i++) { if (mask && !mask(i)) continue; const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.receiveShadow = true; m.frustumCulled = false; scene.add(m); return m;
}
const off = (i, d, y) => [TR.x[i] + TR.nx[i] * d, y, TR.z[i] + TR.nz[i] * d];
const hw = ROAD_W / 2;
// まっすぐ上に向く法線を保証するため 左→右 の順

  camera.position.set(camPos.x + (Math.random() - .5) * shake * .6, camPos.y + (Math.random() - .5) * shake * .4, camPos.z + (Math.random() - .5) * shake * .6);
  const lookD = camMode === 2 ? 20 : 4; camera.lookAt(c.x + Math.sin(c.h) * lookD, camMode === 2 ? 1.1 : 1.2, c.z + Math.cos(c.h) * lookD);
  camera.fov += ((60 + clamp(kmh, 0, 260) * .08 + (c.boostT > 0 ? 12 : 0)) - camera.fov) * .1; camera.updateProjectionMatrix();
  sky.position.copy(camera.position); sunSpr.position.copy(camera.position).addScaledVector(SUN_DIR, 1700); clouds.forEach(cl => cl.position.x += rdt * 2);
  sunLight.position.set(c.x + SUN_DIR.x * 90, SUN_DIR.y * 90, c.z + SUN_DIR.z * 90); sunLight.target.position.set(c.x, 0, c.z);
  // HUD
  $('kmh').textContent = Math.round(kmh);
  let gi = 1; while (gi < 6 && kmh > GEARS[gi + 1]) gi++; const rpm = clamp(.3 + .7 * (kmh - GEARS[gi]) / (GEARS[gi + 1] - GEARS[gi]), .25, 1);
  $('gear').textContent = c.vf < -1 ? 'R' : kmh < 2 ? 'N' : gi; $('rpmBar').style.width = (rpm * 100) + '%';
  $('speedfx').style.opacity = clamp((kmh - 140) / 160, 0, .8) + (c.boostT > 0 ? .25 : 0);
  const lv = c.driftLvl, fill = c.boostT > 0 ? c.boostT / 2 : clamp(c.driftT / 2.8, 0, 1);
  $('driftFill').style.width = fill * 100 + '%'; $('driftFill').style.background = c.boostT > 0 ? '#ff7043' : ['#29b6f6', '#29b6f6', '#ffa726', '#ba68c8'][lv];
  $('driftScore').textContent = Math.floor(driftTotal);
  $('tCur').textContent = fmt(state === 'countdown' ? 0 : finished ? finishTime : raceT - lapStartT);
  $('lapN').textContent = clamp(Math.floor(c.cumF / N) + 1, 1, lapsTotal); if (state === 'racing' || state === 'finished') $('posN').textContent = finished ? finishRank : rank();
  $('flash').style.opacity = Math.max(0, shake * .12);
  if (wrongT > 1.5 && !finished) { const m = $('msg'); if (!m.classList.contains('sticky')) showMsg('逆走！', '#ff5252', true); } else if (wrongT === 0 && $('msg').textContent === '逆走！') { $('msg').classList.remove('sticky'); $('msg').style.opacity = 0; }
  drawMini();
  // おと
  if (ac) { const act = state === 'racing' || state === 'countdown'; eng1.frequency.value = 38 + rpm * 120 + gi * 2; eng2.frequency.value = 19 + rpm * 60; engF.frequency.value = 280 + rpm * 900 + (readInput().thr ? 500 : 0);
    engG.gain.value = act && !paused ? .05 + rpm * .05 : 0; tireG.gain.value = slipping && !paused ? clamp(Math.abs(c.slip) * .5 + (c.hbOn ? .1 : 0), 0, .22) : 0; tireF.frequency.value = 1500 + Math.abs(c.slip) * 800; }
}
const miniCanvas = $('mini'), mg = miniCanvas.getContext('2d'); const mm = document.createElement('canvas'); mm.width = mm.height = 340;
let mScale = 1, mox = 0, moz = 0;
{ let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9; for (let i = 0; i < N; i++) { x0 = Math.min(x0, TR.x[i]); x1 = Math.max(x1, TR.x[i]); z0 = Math.min(z0, TR.z[i]); z1 = Math.max(z1, TR.z[i]); }
  mScale = Math.min(300 / (x1 - x0), 300 / (z1 - z0)); mox = -(x0 + x1) / 2; moz = -(z0 + z1) / 2;
  const g = mm.getContext('2d'); g.lineJoin = 'round'; g.lineCap = 'round';
  const path = () => { g.beginPath(); for (let i = 0; i <= N; i++) { const k = i % N, px = 170 + (TR.x[k] + mox) * mScale, pz = 170 + (TR.z[k] + moz) * mScale; i ? g.lineTo(px, pz) : g.moveTo(px, pz); } };

  const dot = (x, z, col, r) => { mg.fillStyle = col; mg.beginPath(); mg.arc(170 + (x + mox) * mScale, 170 + (z + moz) * mScale, r, 0, 6.283); mg.fill(); };
  ais.forEach(a => dot(a.x, a.z, '#ff5252', 8)); if (player) { dot(player.x, player.z, '#ffca28', 11); mg.strokeStyle = '#000'; mg.lineWidth = 3; mg.stroke(); }
}
function menuCam(rdt) {
  const t = clockT * .12, p = trackAt(0);
  camera.position.set(p.x + Math.cos(t) * 30 + 10, 5, p.z + Math.sin(t) * 30); camera.lookAt(p.x, 1.2, p.z);
  if (!menuCar) { menuCar = makeCar(selCar, CAR_COLORS[selColor]); menuCar.root.position.set(p.x, 0, p.z); menuCar.root.rotation.y = Math.atan2(p.tx, p.tz); scene.add(menuCar.root); }
  sky.position.copy(camera.position); sunSpr.position.copy(camera.position).addScaledVector(SUN_DIR, 1700); sunLight.position.set(p.x + SUN_DIR.x * 90, SUN_DIR.y * 90, p.z + SUN_DIR.z * 90); sunLight.target.position.set(p.x, 0, p.z);
}
let menuCar = null;
function refreshMenuCar() { if (menuCar) { scene.remove(menuCar.root); menuCar = null; } }

/* =============== 傾きハンドル =============== */
let steerMode = 'btn', tiltHas = false, tiltRoll = 0, tiltZero = 0, tiltInv = false;
try { tiltInv = localStorage.getItem('apex.tiltInv') === '1'; } catch (e) {}
function screenAngle() { const a = typeof window.orientation === 'number' ? window.orientation : (screen.orientation ? -screen.orientation.angle : 0); return ((a % 360) + 360) % 360; }
addEventListener('deviceorientation', e => {
  if (e.beta == null || e.gamma == null) return; tiltHas = true;

addEventListener('orientationchange', () => setTimeout(() => { tiltZero = tiltRoll; }, 400));

}

{ const row = $('colors'); CAR_COLORS.forEach((c, i) => { const b = document.createElement('div'); b.className = 'sw' + (i === 0 ? ' sel' : ''); b.style.background = c; b.addEventListener('click', () => { selColor = i; row.querySelectorAll('.sw').forEach((e, k) => e.classList.toggle('sel', k === i)); refreshMenuCar(); }); row.appendChild(b); }); }

bindGroup('steerRow', 'steer', v => steerMode = v); bindGroup('cars', 'car', v => { selCar = +v; refreshMenuCar(); }); bindGroup('modes', 'mode', v => selMode = v); bindGroup('laps', 'laps', v => selLaps = +v);

function toMenu() { state = 'menu'; bgmStop(); if (ac) { engG.gain.value = 0; tireG.gain.value = 0; } if (player) { scene.remove(player.car.root); player = null; } ais.forEach(a => scene.remove(a.car.root)); ais = []; $('hud').classList.add('hidden'); $('result').classList.add('hidden'); $('menu').classList.remove('hidden'); $('msg').classList.remove('sticky'); $('msg').style.opacity = 0; renderBest(); }

$('camBtn').addEventListener('click', cycleCam); $('bgmBtn').addEventListener('click', toggleBgm);
